name: Deploy the scanner to Pages

# The scanner needs a camera, and a browser only hands one to a page served
# over HTTPS from an origin of its own. Pages gives it exactly that, and this
# workflow publishes `docs/` there on every push — including turning Pages on
# the first time it runs, so nobody has to visit the settings screen.

on:
  push:
    branches: [claude/pokemon-card-auth-pricing-rpx6ib]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, so the newest push wins last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
